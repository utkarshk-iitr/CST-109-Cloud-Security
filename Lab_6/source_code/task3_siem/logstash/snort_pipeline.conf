input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "%{MONTHNUM:month}/%{MONTHDAY:day}-%{TIME:time}\s+\[\*\*\]\s+\[%{INT:gid}:%{INT:sid}:%{INT:rev}\]\s+%{DATA:alert_message}\s+\[\*\*\]\s+\[Priority:\s+%{INT:priority}\]\s+\{%{WORD:proto}\}\s+%{IP:src_ip}:%{INT:src_port}\s+->\s+%{IP:dst_ip}:%{INT:dst_port}"
    }
  }

  mutate {
    convert => {
      "priority" => "integer"
      "src_port" => "integer"
      "dst_port" => "integer"
      "gid" => "integer"
      "sid" => "integer"
      "rev" => "integer"
    }
  }

  date {
    match => ["message", "MM/dd-HH:mm:ss.SSSSSS", "MM/dd-HH:mm:ss"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "ids-snort-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
